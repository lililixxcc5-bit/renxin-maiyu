<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的健康档案 · 仁心脉语</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #efe6d3; font-family: 'Noto Sans SC', sans-serif; color: #1c2621; margin: 0; }
  .record-wrap { max-width: 1120px; margin: 0 auto; padding: 40px 20px; }
  .record-header { border-bottom: 1px solid #d9cba7; padding-bottom: 30px; margin-bottom: 40px; }
  .record-header h1 { font-family: 'Noto Serif SC', serif; font-size: 34px; margin: 0 0 10px; }
  .record-header p { color: #46564d; font-size: 14.5px; max-width: 600px; }
  .record-search { display: grid; grid-template-columns: 1fr auto; border: 2px solid #1c2621; max-width: 800px; margin-bottom: 50px; }
  .record-search input { padding: 20px 24px; font-size: 18px; border: none; outline: none; background: transparent; font-family: monospace; letter-spacing: 2px; }
  .record-search button { padding: 0 50px; background: #1c2621; color: #f8f2e3; border: none; font-size: 17px; font-weight: bold; letter-spacing: 4px; cursor: pointer; }
  .record-search button:hover { background: #8b4a36; }
  .record-empty { text-align: center; padding: 80px 20px; border: 1.5px dashed #d9cba7; color: #46564d; font-family: 'Noto Serif SC', serif; }
  .record-empty .re-icon { font-size: 48px; margin-bottom: 20px; opacity: 0.5; }
  .record-empty h3 { font-size: 24px; letter-spacing: 5px; margin: 0 0 10px; color: #1c2621; }
  .record-card { border-top: 2px solid #1c2621; padding: 30px 0; border-bottom: 1px solid #d9cba7; }
  .record-head { display: flex; justify-content: space-between; font-family: monospace; font-size: 14px; color: #8b4a36; margin-bottom: 20px; }
  .record-diag { text-align: center; padding: 40px 0; border-bottom: 1px solid #d9cba7; }
  .rec-label { font-size: 12px; letter-spacing: 5px; color: #8b4a36; font-weight: 700; margin-bottom: 20px; }
  .rec-constitution { font-size: 52px; font-weight: 900; letter-spacing: 12px; color: #1c2621; margin-bottom: 10px; }
  .rec-syndrome { display: inline-block; font-size: 22px; font-weight: 800; color: #8b4a36; border: 2px solid #8b4a36; padding: 8px 30px; letter-spacing: 5px; margin-bottom: 20px; }
  .rec-desc { font-size: 15px; color: #46564d; line-height: 2; max-width: 600px; margin: 0 auto; }
  .record-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; border-bottom: 1px solid #d9cba7; }
  .rec-metric { padding: 30px 20px; border-right: 1px solid #d9cba7; }
  .rec-metric:last-child { border-right: none; }
  .rm-label { display: block; font-size: 11px; letter-spacing: 3px; color: #8a6129; margin-bottom: 10px; }
  .rm-value { display: block; font-size: 24px; font-weight: 900; color: #1c2621; }
  .rm-value em { font-size: 0.6em; color: #8b4a36; font-style: normal; }
  .rm-sub { display: block; font-size: 12px; color: #46564d; margin-top: 6px; }
  .rec-plan { padding: 40px 0; }
  .rec-plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .rec-plan-item { border: 1px solid #d9cba7; padding: 24px; }
  .rec-plan-item h5 { font-family: 'Noto Serif SC', serif; font-size: 16px; margin: 0 0 10px; color: #1c2621; }
  .rec-plan-item p { font-size: 14px; color: #46564d; margin: 0; line-height: 1.8; }
  .rec-herbs { display: flex; flex-wrap: wrap; gap: 10px; }
  .rec-herb { border: 1.5px solid #d9cba7; padding: 10px 24px; font-weight: 800; letter-spacing: 4px; background: #f8f2e3; }
  .record-footer { text-align: center; padding: 30px; border-top: 1px solid #d9cba7; margin-top: 60px; color: #46564d; font-size: 13px; }
  .site-header { position: sticky; top: 0; z-index: 50; background: rgba(239,230,211,0.95); backdrop-filter: blur(6px); border-bottom: 1px solid #d9cba7; }
  .site-header .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 76px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1c2621; }
  .brand img { height: 42px; width: 42px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .brand-text .cn { font-family: 'Noto Serif SC', serif; font-size: 19px; font-weight: 700; letter-spacing: 2px; }
  .brand-text .en { font-size: 10.5px; color: #46564d; letter-spacing: 2px; }
  .main-nav { display: flex; align-items: center; gap: 34px; }
  .main-nav a { font-size: 15px; color: #46564d; text-decoration: none; }
  .main-nav a:hover, .main-nav a.active { color: #1c2621; }
  @media (max-width: 720px) { .record-search { grid-template-columns: 1fr; } .record-search button { padding: 18px; } .record-metrics { grid-template-columns: 1fr 1fr; } .rec-metric { border-right: none; border-bottom: 1px solid #d9cba7; } .rec-constitution { font-size: 36px; letter-spacing: 6px; } .main-nav { display: none; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="images/logo.png" alt="仁心脉语 logo">
      <span class="brand-text">
        <span class="cn">仁心脉语</span>
        <span class="en">RENXIN · MAIYU</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">返回首页</a>
      <a href="booking.html">预约体验</a>
      <a href="record.html" class="active">健康档案</a>
      <a href="booking.html" class="btn-primary" style="padding: 10px 20px; text-decoration: none; color: #f8f2e3; border-radius: 3px;">立即预约</a>
    </nav>
  </div>
</header>

<section class="record-wrap">
  <div class="record-header">
    <div class="section-tag">健康档案</div>
    <h1>输入手机号，查看你的辨证记录</h1>
    <p>每次预约确认后，系统会自动生成一份中医辨证报告，包含体质、证候、养生方案与参考药材。输入预约时填写的手机号即可查询。</p>
  </div>

  <div class="record-search">
    <input type="tel" id="record-phone" maxlength="11" placeholder="请输入预约时填写的 11 位手机号">
    <button id="record-query">查询档案</button>
  </div>

  <div id="record-result">
    <div class="record-empty">
      <div class="re-icon">档</div>
      <h3>尚未查询</h3>
      <p>输入手机号后点击查询，即可查看你的历史辨证报告与养生方案。</p>
    </div>
  </div>
</section>

<footer class="record-footer">
  © 2026 仁心脉语 · RenXinMaiYu | 本设备为创新创业原型样机，档案内容仅作科普参考 · <a href="admin.html" style="color:#8b4a36;">管理员入口</a>
</footer>

<script src="js/record.js"></script>
</body>
</html>
